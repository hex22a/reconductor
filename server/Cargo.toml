[package]
name = "server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-private"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
cron = "0.17.0"
csrf = "0.5.0"
dotenvy = "0.15.7"
fred = "10.1.0"
hex = "0.4.3"
lapin = "4.10.0"
mac_address = { version = "1.1.8", features = ["serde"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["ipnetwork", "mac_address", "migrate", "postgres", "runtime-tokio", "time", "uuid"] }
subtle = "2.6.1"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
