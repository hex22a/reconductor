[package]
name = "scheduler"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
cron = "0.17.0"
dotenvy = "0.15.7"
ipnetwork = { version = "0.21.1", features = ["serde"] }
lapin = "4.10.0"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["ipnetwork", "migrate", "postgres", "runtime-tokio", "time", "uuid"] }
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
