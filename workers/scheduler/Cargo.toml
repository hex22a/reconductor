[package]
name = "scheduler"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
cron = "0.17.0"
dotenvy = "0.15.7"
ipnetwork = { version = "0.21.1", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["ipnetwork", "migrate", "postgres", "runtime-tokio", "time", "uuid"] }
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
thiserror.workspace = true
reconductor-messaging.workspace = true
reconductor-schedule.workspace = true

[dev-dependencies]
mockall.workspace = true
