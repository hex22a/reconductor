services:
  db:
    profiles:
      - backend
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: reconductor
      POSTGRES_DB: reconductor
      POSTGRES_PASSWORD: reconductor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconductor -d reconductor"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    profiles:
      - backend
    image: redis:8.6.0-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles:
      - backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DASHBOARD_URL: ${DASHBOARD_URL}
      DATABASE_URL: postgres://reconductor:reconductor@db:5432/reconductor
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NODE_ENV: production
    ports:
      - 4000:4000
    command: sh -c "./migration && ./server"

  dashboard:
    profiles:
      - frontend
    build: ./dashboard
    depends_on:
      - backend
    ports:
      - 3000:80


