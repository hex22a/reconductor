services:
  db:
    profiles:
      - infra
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  kv:
    profiles:
      - infra
    image: valkey/valkey:9.1.2-alpine3.24
    command: valkey-server --requirepass ${KV_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${KV_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  rabbitmq:
    profiles:
      - infra
    image: rabbitmq:4.2.5-management
    userns_mode: keep-id
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "5672:5672"
      - "15672:15672"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    profiles:
      - infra
    build:
      context: .
      dockerfile: ./migrations/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
    volumes:
      - ./migrations:/migrations
    command: migrate run --source /migrations

  backend:
    profiles:
      - backend
    build:
      context: .
      dockerfile: ./server/Dockerfile
    depends_on:
      migrations:
        condition: service_completed_successfully
      kv:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DASHBOARD_URL: ${DASHBOARD_URL}
      CSRF_SECRET: ${CSRF_SECRET}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      KV_HOST: kv
      KV_PORT: ${KV_PORT}
      KV_DB: ${KV_DB}
      KV_USERNAME: ${KV_USERNAME}
      KV_PASSWORD: ${KV_PASSWORD}
    ports:
      - 3000:3000
    command: sh -c "./server"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://backend:3000/api/v1/health | grep -q healthy"]
      interval: 10s
      timeout: 3s
      retries: 15

  scheduler:
    profiles:
      - backend
    build:
      context: .
      dockerfile: ./workers/scheduler/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    command: sh -c "./scheduler"

  scanner:
    profiles:
      - backend
    build:
      context: .
      dockerfile: ./workers/scanner/Dockerfile
    cap_add:
      - NET_RAW
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    command: sh -c "./scanner"

  dashboard:
    profiles:
      - frontend
    build:
      context: .
      dockerfile: ./dashboard/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PUBLIC_API_URL: http://backend:3000
    ports:
      - 5173:80

