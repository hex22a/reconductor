services:
  db:
    profiles:
      - backend
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    profiles:
      - backend
    image: redis:8.6.0-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  rabbitmq:
    profiles:
      - backend
    image: rabbitmq:4.2.5-management
    userns_mode: keep-id
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    profiles:
      - backend
    build:
      context: .
      dockerfile: ./migrations/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    volumes:
      - ./migrations:/migrations
    command: migrate run --source /migrations

  backend:
    profiles:
      - backend
    build:
      context: .
      dockerfile: ./server/Dockerfile
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DASHBOARD_URL: ${DASHBOARD_URL}
      CSRF_SECRET: ${CSRF_SECRET}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - 3000:3000
    command: sh -c "./server"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  scheduler:
    profiles:
      - workers
    build:
      context: .
      dockerfile: ./workers/scheduler/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    command: sh -c "./scheduler"

  scanner:
    profiles:
      - workers
    build:
      context: .
      dockerfile: ./workers/scanner/Dockerfile
    cap_add:
      - NET_RAW
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    command: sh -c "./scanner"

  dashboard:
    profiles:
      - frontend
    build:
      context: .
      dockerfile: ./dashboard/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PUBLIC_API_URL: http://backend:3000
    ports:
      - 8080:80

