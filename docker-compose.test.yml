services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: reconductor
      POSTGRES_DB: reconductor_test
      POSTGRES_PASSWORD: reconductor
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconductor -d reconductor_test"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8.6.0-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
