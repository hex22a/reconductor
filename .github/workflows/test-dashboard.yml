name: Test Dashboard
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ./dashboard/package.json
      - name: Install Dependencies
        run: pnpm install
        working-directory: ./dashboard
      - name: Run ESLint
        run: pnpm lint
        working-directory: ./dashboard

