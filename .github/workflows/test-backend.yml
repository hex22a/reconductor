name: Test Backend
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install Dependencies
        run: bun install
        working-directory: ./backend
      - name: Run ESLint
        run: bun lint
        working-directory: ./backend
      - name: Run unit tests
        run: bun test:unit
        working-directory: ./backend
      - name: Run platform tests
        run: ./platform_tests.sh
        working-directory: ./backend
        with:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

