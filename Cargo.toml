[workspace]
resolver = "2"
members = [
    "crates/*",
    "server",
    "workers/scanner",
    "workers/scheduler"
]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
mockall = "0.15.0"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
reconductor-messaging = { path = "crates/messaging" }
reconductor-schedule = { path = "crates/schedule" }
reconductor-core = { path = "crates/reconductor-core" }
newtype-derive = { path = "crates/newtype-derive" }
sqlx = { version = "0.9.0", features = ["ipnetwork", "mac_address", "migrate", "postgres", "runtime-tokio", "time", "uuid"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
