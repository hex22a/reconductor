interface Node {
  id: ID!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ValidationError {
  field: String!
  message: String!
}

type Project implements Node {
  id: ID!
  name: String!
  created_at: String!
  scans(first: Int, after: String): ScanConnection!
}

type ProjectEdge {
  cursor: String!
  node: Project!
}

type CreateProjectPayload {
  edge: ProjectEdge
  errors: [ValidationError!]!
}

type ProjectConnection {
  edges: [ProjectEdge!]!
  pageInfo: PageInfo!
}

type Scan implements Node {
  id: ID!
  target: String!
  status: String!
  created_at: String!
  schedule: String
  runs(first: Int, after: String): ScanRunConnection!
}

type ScanEdge {
  cursor: String!
  node: Scan!
}

type CreateScanPayload {
  edge: ScanEdge
  errors: [ValidationError!]!
}

type ScanConnection {
  edges: [ScanEdge!]!
  pageInfo: PageInfo!
}

type ScanRun implements Node {
  id: ID!
  scan_id: String!
  created_at: String!
  hosts(first: Int, after: String): HostConnection!
}

type ScanRunEdge {
  cursor: String!
  node: ScanRun!
}

type ScanRunConnection {
  edges: [ScanRunEdge!]!
  pageInfo: PageInfo!
}

type Host implements Node {
  id: ID!
  ip: String
  mac: String
  hostname: String
  vendor: String
  os_match: String
  os_accuracy: Int
  posts(first: Int, after: String): PortConnection!
}

type HostEdge {
  cursor: String!
  node: Host!
}

type HostConnection {
  edges: [HostEdge!]!
  pageInfo: PageInfo!
}

type Port implements Node {
  id: ID!
  port: Int!
  protocol: String
  state: String
  service: String
  product: String
  version: String
}

type PortEdge {
  cursor: String!
  node: Port!
}

type PortConnection {
  edges: [PortEdge!]!
  pageInfo: PageInfo!
}

type Query {
  node(id: ID!): Node
  projects(first: Int, after: String): ProjectConnection!
  project(id: ID!): Project
  scan(id: ID!): Scan
}

input CreateProjectInput {
  name: String!
}

input CreateScanInput {
  target: String!
  projectId: String!
  schedule: String
}

type Mutation {
  createProject(input: CreateProjectInput!): CreateProjectPayload!
  createScan(input: CreateScanInput!): CreateScanPayload!
}
