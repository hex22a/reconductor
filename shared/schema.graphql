type Project {
  id: ID!
  name: String!
  created_at: String!
}

type Scan {
  id: ID!
  target: String!
  created_at: String!
}

type Query {
  projects: [Project!]!
  project(id: ID!): Project
}

input CreateProjectInput {
  name: String!
}

type Mutation {
  createProject(input: CreateProjectInput!): Project!
}
